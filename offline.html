<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câmera offline</title>
<style>
  :root { --azul:#4463a9; --texto:#1b2a4a; --suave:#6b7690; --fundo:#f4f7fc; --borda:#dfe5ef; }
  html,body { height:100%; margin:0; }
  body { background:var(--fundo); font-family:"Avenir Next","Segoe UI",Roboto,Arial,sans-serif; color:var(--texto);
         display:flex; align-items:center; justify-content:center; text-align:center; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:14px; padding:28px 32px; max-width:420px; margin:16px;
          box-shadow:0 2px 10px rgba(27,42,74,.06); }
  .icone { width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:#fdecea; display:flex; align-items:center; justify-content:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  .nome { font-size:14px; color:var(--azul); font-weight:600; margin:0 0 12px; }
  p { font-size:14px; color:var(--suave); margin:4px 0; line-height:1.5; }
  .verif { margin-top:14px; font-size:12px; }
</style>
</head>
<body>
  <div class="card" role="status">
    <div class="icone" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d92d20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 2l20 20"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12"/><path d="M10 7h4l2 3h2l4-3v10"/>
      </svg>
    </div>
    <h1>Câmera offline</h1>
    <div class="nome" id="nome"></div>
    <p>Esta câmera está sem transmissão no momento.</p>
    <p>Quando ela voltar a transmitir, o vídeo reaparece aqui após a próxima verificação.</p>
    <p class="verif" id="verif"></p>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var nome = q.get("nome"), verif = q.get("verif");
  if (nome) document.getElementById("nome").textContent = nome;
  if (verif) document.getElementById("verif").textContent = "Última verificação: " + verif;
</script>
</body>
</html>
