<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Monitoramento – Telão</title>
<style>
  :root { --azul:#4463a9; --azul-esc:#2f4a86; --fundo:#0d1424; --tile:#111a2e; --texto:#e8eefc; --suave:#9fb0d6; --verde:#2ecc71; --verm:#ff5a4f; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--fundo); color:var(--texto);
              font-family:"Avenir Next","Segoe UI",Roboto,Arial,sans-serif; overflow:hidden; }
  body.ocioso, body.ocioso * { cursor:none !important; }
  #grade { position:absolute; inset:0 0 44px 0; display:grid; gap:6px; padding:6px; }
  .tile { position:relative; background:var(--tile); border-radius:8px; overflow:hidden; }
  .tile iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .rotulo { position:absolute; left:8px; bottom:8px; padding:4px 10px; border-radius:6px; background:rgba(8,14,28,.72);
            font-size:14px; font-weight:600; pointer-events:none; max-width:calc(100% - 16px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rotulo span { font-weight:400; color:var(--suave); }
  .rotulo::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--verm); margin-right:7px; vertical-align:1px;
                    animation:pisca 1.6s infinite; }
  @keyframes pisca { 50% { opacity:.25; } }
  #rodape { position:absolute; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center; gap:22px; padding:0 16px;
            background:linear-gradient(90deg,var(--azul-esc),var(--azul)); font-size:14px; }
  #rodape .marca { font-weight:700; letter-spacing:.3px; }
  #rodape .marca small { font-weight:400; color:#cfdaf5; margin-left:6px; }
  #rodape .esp { flex:1; }
  #rodape .info { color:#dfe7fb; white-space:nowrap; }
  #rodape .info b { color:#fff; }
  #relogio { font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; }
  #pagina { color:#cfdaf5; }
  #aviso { position:absolute; inset:0 0 44px 0; display:none; align-items:center; justify-content:center; text-align:center; color:var(--suave); font-size:20px; }
  #btnTela { position:fixed; top:16px; right:16px; z-index:5; padding:10px 18px; border:0; border-radius:999px; background:#fff; color:var(--azul-esc);
             font:600 15px "Avenir Next","Segoe UI",Arial,sans-serif; box-shadow:0 4px 16px rgba(0,0,0,.35); cursor:pointer; }
  #btnTela:hover { background:#eaf0fb; }
  #erro { color:#ffd2cf; display:none; }
</style>
</head>
<body>
<button id="btnTela" type="button" title="Ocupar a tela inteira">⛶ Tela cheia</button>
<div id="grade" aria-live="polite"></div>
<div id="aviso">Nenhuma câmera online no momento.</div>
<div id="rodape">
  <div class="marca">GeoAPUC<small>Central de Monitoramento – Apucarana</small></div>
  <div class="esp"></div>
  <div class="info" id="erro">⚠ sem conexão com o Portal, mostrando a última lista</div>
  <div class="info" id="contagem"></div>
  <div class="info" id="verif"></div>
  <div class="info" id="pagina"></div>
  <div id="relogio"></div>
</div>
<script>
(function () {
  // ===== CONFIGURAÇÃO =====
  var CAMADA = "https://geo.apucarana.pr.gov.br/server/rest/services/Hosted/Cameras_Apucarana/FeatureServer/0";
  var ATUALIZA_MIN = 5;          // reconsulta o status a cada 5 min
  var MAX_POR_TELA = 9;          // acima disso, alterna em páginas
  var TROCA_PAGINA_SEG = 30;     // tempo de cada página quando houver alternância
  var q = new URLSearchParams(location.search);
  if (q.get("max")) MAX_POR_TELA = Math.max(1, parseInt(q.get("max"), 10) || MAX_POR_TELA);
  if (q.get("camada")) CAMADA = q.get("camada");

  var grade = document.getElementById("grade"), aviso = document.getElementById("aviso");
  var cams = [], total = 0, pag = 0, tiles = {};

  function fmt(ms) { if (!ms) return ""; var d = new Date(ms);
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}); }

  function colunas(n) {             // escolhe a grade que deixa os vídeos (16:9) maiores
    var W = grade.clientWidth - 12, H = grade.clientHeight - 12, melhor = 1, area = 0;
    for (var c = 1; c <= n; c++) {
      var r = Math.ceil(n / c), w = (W - (c - 1) * 6) / c, h = (H - (r - 1) * 6) / r;
      var a = Math.min(w, h * 16 / 9) * Math.min(h, w * 9 / 16);
      if (a > area) { area = a; melhor = c; }
    }
    return melhor;
  }

  function desenha() {
    var paginas = Math.max(1, Math.ceil(cams.length / MAX_POR_TELA));
    if (pag >= paginas) pag = 0;
    var vis = cams.slice(pag * MAX_POR_TELA, (pag + 1) * MAX_POR_TELA);
    aviso.style.display = vis.length ? "none" : "flex";
    var c = colunas(Math.max(1, vis.length)), r = Math.ceil(Math.max(1, vis.length) / c);
    grade.style.gridTemplateColumns = "repeat(" + c + ", 1fr)";
    grade.style.gridTemplateRows = "repeat(" + r + ", 1fr)";
    var manter = {};
    vis.forEach(function (cam) { manter[cam.url] = true; });
    Object.keys(tiles).forEach(function (u) { if (!manter[u]) { tiles[u].remove(); delete tiles[u]; } });
    vis.forEach(function (cam) {            // reaproveita o vídeo que já está tocando (sem piscar)
      var t = tiles[cam.url];
      if (!t) {
        t = document.createElement("div"); t.className = "tile";
        var f = document.createElement("iframe"); f.src = cam.url; f.allow = "autoplay; fullscreen"; f.title = cam.nome;
        var l = document.createElement("div"); l.className = "rotulo";
        t.appendChild(f); t.appendChild(l); tiles[cam.url] = t;
      }
      t.querySelector(".rotulo").innerHTML = "";
      t.querySelector(".rotulo").appendChild(document.createTextNode(cam.nome));
      if (cam.bairro) { var s = document.createElement("span"); s.textContent = " · " + cam.bairro; t.querySelector(".rotulo").appendChild(s); }
      grade.appendChild(t);
    });
    document.getElementById("contagem").innerHTML = "<b>" + cams.length + "</b> de " + total + " câmeras online";
    document.getElementById("pagina").textContent = paginas > 1 ? ("tela " + (pag + 1) + "/" + paginas) : "";
  }

  function consulta() {
    var url = CAMADA + "/query?where=1%3D1&outFields=descricao,bairro,status,url_player,cctv,ultima_verificacao&orderByFields=descricao&returnGeometry=false&f=json&_=" + Date.now();
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error.message);
      var fs = j.features || []; total = fs.length;
      var ult = 0;
      cams = fs.map(function (f) { return f.attributes; }).filter(function (a) {
        ult = Math.max(ult, a.ultima_verificacao || 0);
        var u = a.url_player || a.cctv || "";
        return String(a.status).toLowerCase() === "online" && u && u.indexOf("offline.html") < 0;
      }).map(function (a) { return { nome: a.descricao || "Câmera", bairro: a.bairro || "", url: a.url_player || a.cctv }; });
      document.getElementById("verif").textContent = ult ? "status verificado em " + fmt(ult) : "";
      document.getElementById("erro").style.display = "none";
      desenha();
    }).catch(function () { document.getElementById("erro").style.display = "block"; });
  }

  function relogio() {
    var d = new Date();
    document.getElementById("relogio").textContent = d.toLocaleTimeString("pt-BR");
  }

  // tela cheia
  var btn = document.getElementById("btnTela");
  btn.onclick = function () { var el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); };
  document.addEventListener("fullscreenchange", function () { btn.style.display = document.fullscreenElement ? "none" : "block"; });
  if (q.get("botao") === "nao") btn.style.display = "none";

  // esconde o cursor parado
  var t0; function mexeu() { document.body.classList.remove("ocioso"); clearTimeout(t0); t0 = setTimeout(function(){ document.body.classList.add("ocioso"); }, 3000); }
  ["mousemove","mousedown","touchstart"].forEach(function (e) { document.addEventListener(e, mexeu); }); mexeu();

  window.addEventListener("resize", desenha);
  relogio(); setInterval(relogio, 1000);
  consulta(); setInterval(consulta, ATUALIZA_MIN * 60000);
  setInterval(function () { if (cams.length > MAX_POR_TELA) { pag++; desenha(); } }, TROCA_PAGINA_SEG * 1000);
  setInterval(function () { location.reload(); }, 6 * 3600000);   // recarrega a cada 6 h, por segurança
})();
</script>
</body>
</html>
